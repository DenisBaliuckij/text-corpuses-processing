# Port 5335 is shared by three independent solutions on this host:
#   - Open WebUI (Ollama's chat UI), moved to an internal-only port so this
#     proxy can own 5335 - served at the root path.
#   - The custom-query PDF UI (webui/, this repo), served under /customquery.
#   - A static ops report (tools/generate_ops_report.py, regenerated
#     every 30 minutes by cron), served under /report.
server {
    # HTTPS since 2026-09-27 (self-signed certificate, /home/s939/nginx-ssl on the host)
    listen 5335 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/corpus-host.crt;
    ssl_certificate_key /etc/nginx/ssl/corpus-host.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # plain http:// sent to this TLS port: redirect to https:// on the same host:port the client used
    error_page 497 =301 https://$http_host$request_uri;
    # relative redirects (/report -> /report/): correct behind the external NAT port mapping
    absolute_redirect off;

    client_max_body_size 20m;

    location /report/ {
        alias /usr/share/nginx/ops-report/;
        index index.html;
        charset utf-8;
        default_type "text/html; charset=utf-8";
    }

    location = /report {
        return 301 /report/;
    }

    location /customquery/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /customquery;
    }

    # Bare /customquery (no trailing slash) -> redirect so relative
    # links/forms inside the app resolve correctly.
    location = /customquery {
        return 301 /customquery/;
    }

    # Corpus catalogue (corpus-browser container on 127.0.0.1:8095): browse/search/download the documents
    # classified in DocumentCatalog, REST JSON API under /corpus/api/. Password is checked by the app
    # (HTTP Basic), so no auth here. The app routes include the /corpus prefix: pass the path unchanged.
    location /corpus/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;      # stream large downloads instead of spooling them in nginx
    }

    location = /corpus {
        return 301 /corpus/;
    }

    # --- langembed project additions ---
    # Forwarded to the langembed nginx (port 8180, unchanged) rather than duplicated
    # here, so auth and routing stay defined in one place. Use with a trailing slash
    # (see the /report bare-path redirect above for what happens without one on this
    # host's external NAT setup).
    location /downloads/ {
        proxy_pass http://127.0.0.1:8180/downloads/;
        proxy_set_header Host $host;
    }

    location /embeddings/ {
        proxy_pass http://127.0.0.1:8180/embeddings/;
        proxy_set_header Host $host;
    }

    location /langembed-report/ {
        proxy_pass http://127.0.0.1:8180/report/;
        proxy_set_header Host $host;
    }

    location /grammar-downloads/ {
        proxy_pass http://127.0.0.1:8180/grammar-downloads/;
        proxy_set_header Host $host;
    }
    # --- end langembed project additions ---

    location / {
        proxy_pass http://127.0.0.1:5336;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Open WebUI uses WebSockets for streaming responses.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
